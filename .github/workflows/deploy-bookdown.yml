on:
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

name: render book

permissions:
  contents: write

jobs:
  render:
    name: render book
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::bookdown
            any::rmarkdown
            any::knitr

      - name: Render book to docs
        run: |
          bookdown::render_book("index.Rmd", "bookdown::gitbook", output_dir = "docs")
        shell: Rscript {0}

      - name: Add custom domain
        run: |
          echo "gitbookdown.eigenfairy.com" > docs/CNAME

      - name: Commit rendered book
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/
          git diff --cached --quiet || git commit -m "Render book"
          git push